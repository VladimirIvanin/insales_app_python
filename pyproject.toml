[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insales-partner-app"
version = "0.1.0"
description = "Заготовка устанавливаемого приложения InSales на Python"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "Flask>=3.0,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.0,<8.0",
]

dev = [
    "ruff>=0.17,<1.0",
    "pip-audit>=2.10,<3.0",
]

[project.scripts]
insales-app = "app.cli:main"

[tool.setuptools.packages.find]
include = ["insales*", "app*", "app.db*", "app.db.migrations*"]

[tool.setuptools.package-data]
"app" = ["templates/*.html"]
"app.db.migrations" = ["*.sql"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S105", "B017"]
"insales/crypto.py" = ["S324"]
"tests/test_crypto.py" = ["S324"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["insales", "app"]